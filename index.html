<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IPTV Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{background:#161b22;padding:10px 12px;border-bottom:1px solid #30363d;flex-shrink:0}
header h1{font-size:16px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
header h1 span{color:#58a6ff}
.inputrow{display:flex;gap:6px;margin-bottom:6px}
.inputrow input[type=text]{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:8px 10px;font-size:14px;outline:none}
.inputrow input[type=text]:focus{border-color:#58a6ff}
.btn{background:#238636;color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:active{opacity:.7}
.btn.gray{background:#21262d;border:1px solid #30363d}
.btn.blue{background:#1f6feb}
#status{font-size:12px;color:#8b949e;margin-top:4px}
#pastebox{display:none;margin-top:8px}
#pastebox textarea{width:100%;height:80px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:8px;font-size:12px;font-family:monospace;resize:vertical}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#8b949e;padding:6px;font-size:12px;text-align:center;cursor:pointer}
.tab.active{background:#1f6feb;color:#fff;border-color:#1f6feb}
#playerwrap{display:none;background:#000;position:relative;flex-shrink:0}
#playerwrap video{width:100%;aspect-ratio:16/9;background:#000;display:block;max-height:45vh}
#nowplaying{display:none;background:#161b22;padding:6px 12px;font-size:13px;border-bottom:1px solid #30363d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
#nowplaying b{color:#58a6ff}
#toolbar{display:flex;gap:6px;padding:8px 12px;align-items:center;flex-shrink:0}
#search{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:7px 10px;font-size:13px;outline:none}
#chcount{font-size:12px;color:#8b949e;white-space:nowrap}
#chlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 40px}
.chgroup{font-size:12px;color:#8b949e;padding:10px 14px 4px;background:#0d1117;position:sticky;top:0;text-transform:uppercase;letter-spacing:.5px}
.ch{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;border-bottom:1px solid #21262d}
.ch:active,.ch.playing{background:#1f2937}
.ch img{width:36px;height:36px;border-radius:4px;object-fit:contain;background:#21262d;flex-shrink:0}
.ch .ph{width:36px;height:36px;border-radius:4px;background:#21262d;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ch .info{min-width:0}
.ch .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .grp{font-size:11px;color:#8b949e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#empty{text-align:center;padding:40px 20px;color:#8b949e}
#empty .ic{font-size:48px;margin-bottom:12px}
#empty p{font-size:13px;line-height:1.6}
footer{position:fixed;bottom:0;left:0;right:0;background:#161b22;border-top:1px solid #30363d;padding:8px 12px;display:flex;gap:8px;justify-content:center;z-index:10}
@media(min-width:768px){#playerwrap video{max-height:50vh}}
</style>
</head>
<body>
<div id="app">
<header>
<h1>📺 <span>IPTV</span> Player</h1>
<div class="tabs">
<div class="tab active" data-tab="url">🌐 URL</div>
<div class="tab" data-tab="paste">📋 Yapıştır</div>
<div class="tab" data-tab="file">📁 Dosya</div>
</div>
<div id="tab-url">
<div class="inputrow">
<input type="text" id="m3uurl" placeholder="M3U playlist URL'si..." autocomplete="off">
<button class="btn" id="loadbtn">Yükle</button>
</div>
<div id="status">Otomatik yükleme denenecek...</div>
</div>
<div id="tab-paste" style="display:none">
<div id="pastebox" style="display:block">
<textarea id="m3utext" placeholder="M3U içeriğini buraya yapıştırın...&#10;&#10;#EXTM3U&#10;#EXTINF:-1 tvg-logo=&quot;...&quot; group-title=&quot;News&quot;,Kanal Adı&#10;http://stream.url/playlist.m3u8"></textarea>
<div class="inputrow" style="margin-top:6px">
<button class="btn blue" id="pastebtn" style="flex:1">Yapıştırılanı Yükle</button>
</div>
</div>
</div>
<div id="tab-file" style="display:none">
<div class="inputrow">
<button class="btn gray" id="filebtn" style="flex:1">📁 M3U Dosyası Seç</button>
<input type="file" id="fileinput" accept=".m3u,.m3u8,text/plain" style="display:none">
</div>
<div style="font-size:12px;color:#8b949e;margin-top:4px">Dosyayı seçtikten sonra otomatik yüklenir</div>
</div>
</header>
<div id="playerwrap">
<video id="video" controls playsinline webkit-playsinline></video>
</div>
<div id="nowplaying"></div>
<div id="toolbar">
<input type="text" id="search" placeholder="🔍 Kanal ara...">
<span id="chcount"></span>
</div>
<div id="chlist">
<div id="empty">
<div class="ic">📡</div>
<p>Kanal yükleniyor...<br><br>
<b>3 yöntem:</b><br>
1. URL sekmesi — sunucumuz otomatik çeker<br>
2. Yapıştır — M3U metnini kopyala-yapıştır<br>
3. Dosya — .m3u dosyasını seç</p>
</div>
</div>
</div>
<footer>
<span style="font-size:11px;color:#8b949e">iOS 10+ • Ana ekrana eklenebilir</span>
</footer>

<script>
(function(){
var channels=[];
var currentIdx=-1;
var video=document.getElementById('video');
var playerwrap=document.getElementById('playerwrap');
var nowplaying=document.getElementById('nowplaying');
var chlist=document.getElementById('chlist');
var statusEl=document.getElementById('status');
var searchEl=document.getElementById('search');
var chcount=document.getElementById('chcount');
var m3uurl=document.getElementById('m3uurl');
var m3utext=document.getElementById('m3utext');

function setStatus(t){statusEl.textContent=t;}

// Tab switching
var tabs=document.querySelectorAll('.tab');
for(var t=0;t<tabs.length;t++){
tabs[t].onclick=function(){
var target=this.getAttribute('data-tab');
for(var k=0;k<tabs.length;k++)tabs[k].classList.remove('active');
this.classList.add('active');
document.getElementById('tab-url').style.display=(target==='url')?'block':'none';
document.getElementById('tab-paste').style.display=(target==='paste')?'block':'none';
document.getElementById('tab-file').style.display=(target==='file')?'block':'none';
};
}

// 1) Same-origin channels.json (GitHub Action tarafından güncellenir, CORS yok)
function loadFromJson(){
return fetch('channels.json',{cache:'no-cache'}).then(function(r){
if(!r.ok) throw new Error('HTTP '+r.status);
return r.json();
}).then(function(data){
if(data&&data.length){
channels=data;
currentIdx=-1;
renderList('');
setStatus(data.length+' kanal yüklendi (sunucu)');
}
});
}

// 2) URL yükleme — proxy fallback'ler
function loadFromUrl(url){
function tryFetch(finalUrl){
return fetch(finalUrl,{mode:'cors'}).then(function(r){
if(!r.ok) throw new Error('HTTP '+r.status);
return r.text();
});
}
var attempts=[
'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(url),
'https://corsproxy.io/?'+encodeURIComponent(url),
url
];
var i=0;
function next(){
if(i>=attempts.length){
setStatus('URL yüklenemedi. Yapıştır veya Dosya yöntemini deneyin.');
return;
}
tryFetch(attempts[i++])
.then(function(text){
if(text.indexOf('EXTINF')===-1) throw new Error('M3U formatı değil');
parseM3U(text);
setStatus(channels.length+' kanal yüklendi (URL)');
})
.catch(function(){next();});
}
next();
}

// 3) Yapıştırma
document.getElementById('pastebtn').onclick=function(){
var text=m3utext.value;
if(!text||text.indexOf('EXTINF')===-1){
alert('Geçerli bir M3U metni değil. #EXTINF satırları içermeli.');
return;
}
parseM3U(text);
setStatus(channels.length+' kanal yüklendi (yapıştırma)');
};

// 4) Dosya seçme
document.getElementById('filebtn').onclick=function(){document.getElementById('fileinput').click();};
document.getElementById('fileinput').onchange=function(e){
var f=e.target.files[0];if(!f)return;
var r=new FileReader();
r.onload=function(){parseM3U(r.result);setStatus(channels.length+' kanal yüklendi (dosya)');};
r.readAsText(f);
};

// URL yükleme butonu
document.getElementById('loadbtn').onclick=function(){
var url=m3uurl.value.replace(/^\s+|\s+$/g,'');
if(!url){setStatus('URL boş olamaz');return;}
setStatus('URL yükleniyor...');
try{localStorage.setItem('iptv_m3u_url',url);}catch(e){}
loadFromUrl(url);
};

// M3U parse
function parseM3U(text){
channels=[];
currentIdx=-1;
var lines=text.split(/\r?\n/);
var pending=null;
for(var i=0;i<lines.length;i++){
var line=lines[i].replace(/^\s+|\s+$/g,'');
if(!line)continue;
if(line.indexOf('#EXTINF')===0){
var name='',logo='',group='';
var cm=line.match(/tvg-logo="([^"]*)"/i);
if(cm)logo=cm[1];
cm=line.match(/group-title="([^"]*)"/i);
if(cm)group=cm[1];
var dp=line.lastIndexOf(',');
if(dp>-1)name=line.substring(dp+1).replace(/^\s+|\s+$/g,'');
pending={name:name||'Kanal',logo:logo,group:group||'Diğer',url:''};
}else if(line.indexOf('#')===0){
// skip
}else if(pending){
pending.url=line;
channels.push(pending);
pending=null;
}
}
renderList('');
}

// Liste render
function renderList(q){
chlist.innerHTML='';
chcount.textContent=channels.length?channels.length+' kanal':'';
if(!channels.length){
chcount.textContent='';
chlist.innerHTML='<div id="empty"><div class="ic">📡</div><p>Kanal yok.<br>Yukarıdan yöntem seçin.</p></div>';
return;
}
q=(q||'').toLowerCase();
var groups={};
var order=[];
for(var i=0;i<channels.length;i++){
var c=channels[i];
if(q&&(c.name.toLowerCase().indexOf(q)===-1&&c.group.toLowerCase().indexOf(q)===-1))continue;
if(!groups[c.group]){groups[c.group]=[];order.push(c.group);}
groups[c.group].push({ch:c,idx:i});
}
for(var g=0;g<order.length;g++){
var gname=order[g];
var hd=document.createElement('div');
hd.className='chgroup';
hd.textContent=gname+' ('+groups[gname].length+')';
chlist.appendChild(hd);
var arr=groups[gname];
for(var j=0;j<arr.length;j++){
(function(item){
var el=document.createElement('div');
el.className='ch';
if(item.idx===currentIdx)el.className+=' playing';
var imgHtml;
if(item.ch.logo){
imgHtml='<img src="'+esc(item.ch.logo)+'" onerror="this.style.display=\'none\'">';
}else{
imgHtml='<div class="ph">📺</div>';
}
el.innerHTML=imgHtml+'<div class="info"><div class="nm">'+esc(item.ch.name)+'</div><div class="grp">'+esc(item.ch.group)+'</div></div>';
el.onclick=function(){playChannel(item.idx);};
chlist.appendChild(el);
})(arr[j]);
}
}
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function playChannel(idx){
if(idx<0||idx>=channels.length)return;
currentIdx=idx;
var c=channels[idx];
playerwrap.style.display='block';
nowplaying.style.display='block';
nowplaying.innerHTML='▶ <b>'+esc(c.name)+'</b> — '+esc(c.group);
video.src=c.url;
video.load();
var p=video.play();
if(p&&p.catch)p.catch(function(){});
renderList(searchEl.value);
}

video.addEventListener('error',function(){
if(currentIdx>=0&&channels[currentIdx]){
nowplaying.innerHTML='⚠️ <b>'+esc(channels[currentIdx].name)+'</b> oynatılamadı';
}
});

searchEl.addEventListener('input',function(){renderList(searchEl.value);});

// Son URL'yi hatırlat
try{var saved=localStorage.getItem('iptv_m3u_url');if(saved)m3uurl.value=saved;}catch(e){}

// Başlangıç: önce same-origin JSON dene
setStatus('Sunucu playlist kontrol ediliyor...');
loadFromJson().catch(function(){
// JSON yoksa ve kayıtlı URL varsa onu dene
var saved=null;
try{saved=localStorage.getItem('iptv_m3u_url');}catch(e){}
if(saved){
m3uurl.value=saved;
loadFromUrl(saved);
}else{
setStatus('Playlist yok. URL, Yapıştır veya Dosya ile yükleyin.');
}
});

})();
</script>
</body>
</html>
